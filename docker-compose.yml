services:
  mongo:
    image: mongo:8
    container_name: rocket-stats-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: rocket
      MONGO_INITDB_ROOT_PASSWORD: rocket
      MONGO_INITDB_DATABASE: rocket_stats
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Web UI on http://localhost:8081 to browse the data by hand.
  mongo-express:
    image: mongo-express:1
    container_name: rocket-stats-mongo-ui
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://rocket:rocket@mongo:27017/?authSource=admin
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
